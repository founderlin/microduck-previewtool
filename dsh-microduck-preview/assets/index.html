<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Microduck Playground</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head>
<body><main class="app"><header><strong>Microduck</strong><span>Playground</span><span id="connection">连接中</span></header><div id="notice" role="status" hidden></div><div class="layout"><section class="main"><div class="heading"><span>当前动作</span><strong id="summary">在对话中输入 /duck_go 描述动作</strong><span id="status">等待指令</span></div><div id="viewport" tabindex="0" aria-label="拖拽旋转场景，滚轮缩放"><img id="frame" alt="Microduck 运动学参考场景" hidden><div id="empty">在对话中输入 /duck_go 描述动作</div><div class="hint">拖拽旋转 · 滚轮缩放</div></div><div class="controls"><button id="execute" class="primary" disabled>执行动作</button><button id="stop" disabled>中止</button><button id="reset" disabled>复位</button><button id="return-action" hidden>返回动作</button><button id="export" hidden>导出视频</button></div></section><aside><h2>训练权重</h2><p>修改权重用于后续训练，不改变当前动作。</p><div id="rewards"></div><p id="save-status" role="status"></p></aside></div></main></body></html>
